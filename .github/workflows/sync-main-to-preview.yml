name: Sync main into Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-into-preview
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into homepage-arcade-catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: homepage-arcade-catalog
          fetch-depth: 0

      - name: Merge latest main without overwriting Preview work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main homepage-arcade-catalog
          git checkout homepage-arcade-catalog
          git merge --no-edit --no-ff origin/main
          git push origin HEAD:homepage-arcade-catalog
