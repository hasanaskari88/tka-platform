name: Visual Math Engine checks

on:
  push:
    branches:
      - main
    paths:
      - 'lib/visual-math/**'
      - 'app/api/admin/ai/analyze-visual-intent/route.ts'
      - 'app/admin/asisten-ai/page.tsx'
      - 'app/api/media/upload/route.ts'
      - 'lib/ai/provider.ts'
      - 'lib/visual-math/contracts/facts.ts'
      - 'lib/visual-math/semantic/validate-fact-graph.ts'
      - 'scripts/test-visual-math.cjs'
      - 'scripts/test-fraction-v2.cjs'
      - '.github/workflows/visual-math-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-math-checks-main
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run legacy Visual Math tests
        run: npm run test:visual-math

      - name: Run fraction V2 contract and renderer tests
        run: npm run test:visual-math:v2

      - name: Type-check the application
        run: npx tsc --noEmit

      - name: Lint changed Visual Math files
        run: >-
          npm run lint -- 
          app/api/admin/ai/analyze-visual-intent/route.ts
          app/admin/asisten-ai/page.tsx
          app/api/media/upload/route.ts
          lib/ai/provider.ts
          lib/visual-math/contracts/facts.ts
          lib/visual-math/semantic/validate-fact-graph.ts
          lib/visual-math/analysis/build-ai-intent.ts
          lib/visual-math/analysis/fraction-v2.ts
          lib/visual-math/types.ts
          lib/visual-math/semantic/build-fact-graph.ts
          lib/visual-math/math/operation-planner.ts
          lib/visual-math/renderers/canvas.ts
          lib/visual-math/renderers/pictograph-scale.ts
          lib/visual-math/renderers/registry.ts
          lib/visual-math/renderers/types.ts
          lib/visual-math/quality/validate-artifact.ts
          lib/visual-math/quality/validate-visual-layout.ts
          lib/visual-math/index.ts
          scripts/test-visual-math.cjs
          scripts/test-fraction-v2.cjs
